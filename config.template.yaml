# Шаблон конфига mihomo. core\build-config.ps1 подставляет вместо SUBSCRIPTION_URL ссылку
# из subscription.txt и сохраняет результат в core\config.yaml (в git не попадает).
# Справочник по полям: https://wiki.metacubex.one/config/

mode: rule
log-level: warning         # info пишет каждое соединение, лог растёт на десятки МБ в день
ipv6: false
unified-delay: true
tcp-concurrent: true
find-process-mode: always  # правила PROCESS-NAME должны знать процесс для каждого соединения
geo-auto-update: false     # GEOIP/GEOSITE не используем, базы не нужны

# Локальный HTTP/SOCKS5-прокси для программ на этом же компьютере: всё, что пришло
# на этот порт, идёт через прокси (правило IN-PORT ниже). Например, curl -x http://127.0.0.1:7890 ...
mixed-port: 7890
bind-address: 127.0.0.1
allow-lan: false

# API и веб-панель: http://127.0.0.1:9090/ui (панель скачивается при первом запуске)
external-controller: 127.0.0.1:9090
external-ui: ui
external-ui-url: https://github.com/MetaCubeX/metacubexd/releases/latest/download/compressed-dist.tgz
secret: ""

profile:
  store-selected: false
  store-fake-ip: false

# Виртуальный адаптер: через него проходит весь трафик машины, но наружу через прокси
# уходит только то, что разрешено правилами ниже, остальное идёт напрямую
tun:
  enable: true
  device: mihomo
  stack: mixed
  auto-route: true
  auto-detect-interface: true   # обязательно, иначе прямой трафик зациклится в адаптер
  strict-route: true
  dns-hijack:
    - any:53

# Восстанавливаем доменное имя из TLS/HTTP, чтобы прокси получал домен, а не IP
sniffer:
  enable: true
  force-dns-mapping: true
  parse-pure-ip: true
  override-destination: true
  sniff:
    HTTP:
      ports: [80, 8080-8880]
    TLS:
      ports: [443, 8443]
    QUIC:
      ports: [443]

# DNS: всё через системные резолверы, а домены Claude через DoH 1.1.1.1 поверх прокси,
# чтобы провайдер не видел эти запросы. По процессу DNS в mihomo не разделить
dns:
  enable: true
  enhanced-mode: redir-host
  nameserver:
    - system
  nameserver-policy:
    "+.anthropic.com": "https://1.1.1.1/dns-query#proxy"
    "+.claude.ai": "https://1.1.1.1/dns-query#proxy"
    "+.claude.com": "https://1.1.1.1/dns-query#proxy"

# Подписка: mihomo сам скачивает её каждые interval секунд и подменяет серверы
# на лету, без перезапуска. exclude-filter: регулярное выражение Go по имени сервера
proxy-providers:
  sub:
    type: http
    url: "SUBSCRIPTION_URL"
    interval: 10800
    path: ./providers/sub.yaml
    proxy: DIRECT
    exclude-filter: "🇷🇺|(?i)росси|(?i)\\brussia\\b|(?i)(^|[^a-z])ru([^a-z]|$)|Gemini"
    # Правки серверов при каждом обновлении подписки. gRPC с пустым grpc-service-name
    # mihomo отправляет на путь /GunService/Tun, а xray-серверы ждут //Tun, как клиенты xray и sing-box
    override:
      override-expr:
        - '(select(.network == "grpc" and (.grpc-opts.grpc-service-name == "" or .grpc-opts.grpc-service-name == null)) | .grpc-opts.grpc-service-name) = "//Tun"'
    health-check:
      enable: true
      url: https://www.gstatic.com/generate_204
      interval: 300
      timeout: 5000
      lazy: true

# Группа proxy сама выбирает самый быстрый сервер из подписки
proxy-groups:
  - name: proxy
    type: url-test
    use: [sub]
    url: https://www.gstatic.com/generate_204
    interval: 300
    tolerance: 100
    lazy: true

# Российские домены и IP из https://github.com/MetaCubeX/meta-rules-dat: mihomo сам скачивает
# списки и обновляет их раз в сутки. ru-domains: зоны .ru, .su, .рф и российские сервисы
# на других доменах (Яндекс, VK и т.п.), ru-ip: российские диапазоны адресов
rule-providers:
  ru-domains:
    type: http
    behavior: domain
    format: mrs
    url: https://github.com/MetaCubeX/meta-rules-dat/raw/meta/geo/geosite/category-ru.mrs
    path: ./rules/category-ru.mrs
    interval: 86400
    proxy: DIRECT
  ru-ip:
    type: http
    behavior: ipcidr
    format: mrs
    url: https://github.com/MetaCubeX/meta-rules-dat/raw/meta/geo/geoip/ru.mrs
    path: ./rules/geoip-ru.mrs
    interval: 86400
    proxy: DIRECT

# Через прокси идут только эти процессы и всё, что пришло на локальный порт 7890; остальное напрямую.
# Российские сайты идут напрямую всегда, даже от Claude и через порт 7890 (например, когда расширение
# браузера отправляет в прокси все сайты): банки и госуслуги часто не пускают с зарубежных IP.
# no-resolve: список IP проверяется, только если программа подключается прямо по IP. Иначе mihomo
# резолвил бы через системный DNS каждый домен, идущий в прокси, и провайдер видел бы эти запросы
rules:
  - RULE-SET,ru-domains,DIRECT
  - RULE-SET,ru-ip,DIRECT,no-resolve
  - PROCESS-NAME,Claude.exe,proxy
  - PROCESS-NAME,claude.exe,proxy
  - IN-PORT,7890,proxy
  - MATCH,DIRECT
